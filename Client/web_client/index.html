<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #f7f8fa;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
            /* 新增：主背景直接加透明度，替代伪元素的间接控制 */
            opacity: 1; /* 主容器不透明，避免影响子元素 */
        }

        /* 背景覆盖层 - 默认无背景图，由JS动态注入样式控制 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f7f8fa;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: 0.3;
            z-index: -1;
            pointer-events: none;
        }

        /* 左侧功能导航 */
        .sidebar {
            width: 20%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            border-right: 1px solid #f0f0f0;
            padding: 20px 0;
            position: relative;
            z-index: 1;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin: 8px 0;
        }

        .sidebar-menu a {
            display: block;
            padding: 12px 24px;
            color: #333;
            text-decoration: none;
            font-size: 15px;
            border-left: 3px solid transparent;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background: rgba(78, 140, 255, 0.1);
            color: #4e8cff;
            border-left-color: #4e8cff;
        }

        /* 右侧内容区域容器 */
        .content-area {
            width: 80%;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* 所有iframe共享同一个容器区域 */
        .content-embed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            /* 核心修改：添加不透明背景色，阻断父级背景透传 */
            background: #ffffff; /* 替换为你想要的iframe默认背景色（比如和iframe自身一致的底色） */
            /* 移除原有 transparent 配置，避免透传 */
        }

        /* 激活的iframe可见 */
        .content-embed.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .content-area {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 左侧功能导航 -->
    <div class="sidebar">
        <ul class="sidebar-menu">
            <li><a href="#" class="active" data-target="chat">聊天页面</a></li>
            <li><a href="#" data-target="setting">配置页面</a></li>
        </ul>
    </div>

    <!-- 右侧嵌入内容：两个iframe并存，切换显示 -->
    <div class="content-area">
        <!-- 聊天页iframe -->
        <iframe src="chat.html" class="content-embed active" frameborder="0" id="iframe-chat" allowtransparency="true"></iframe>
        
        <!-- 配置页iframe -->
        <iframe src="setting.html" class="content-embed" frameborder="0" id="iframe-setting" allowtransparency="true"></iframe>
    </div>

    <script src="js/indexeddb_utils.js"></script>
    <script>
        const menuItems = document.querySelectorAll('.sidebar-menu a');
        const iframeChat = document.getElementById('iframe-chat');
        const iframeSetting = document.getElementById('iframe-setting');
        
        menuItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                menuItems.forEach(link => link.classList.remove('active'));
                this.classList.add('active');
                
                const target = this.getAttribute('data-target');
                
                iframeChat.classList.remove('active');
                iframeSetting.classList.remove('active');
                
                if (target === 'chat') {
                    iframeChat.classList.add('active');
                } else if (target === 'setting') {
                    iframeSetting.classList.add('active');
                }
            });
        });

        // 初始化：根据URL hash切换菜单
        window.addEventListener('load', async function() {
            const hash = window.location.hash.slice(1) || 'chat';
            menuItems.forEach(item => {
                if (item.getAttribute('data-target') === hash) {
                    item.click();
                }
            });
            
            await applySavedBackground();
            
            // 等 iframe 加载完成后同步背景
            document.querySelectorAll('.content-embed').forEach(iframe => {
                iframe.addEventListener('load', async function() {
                    try {
                        const bgConfig = await getSetting('bgConfig');
                        if (bgConfig?.image) {
                            syncBackgroundToIframes(bgConfig.image, parseFloat(bgConfig.opacity || '0.3'));
                        }
                    } catch (err) {
                        console.error('同步背景到iframe失败：', err);
                    }
                });
            });
        });

        // 监听来自setting.html的消息
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'updateBackground') {
                applyBackground(event.data.bgImage, event.data.bgOpacity);
            }
            
            // 响应 iframe 的背景请求
            if (event.data && event.data.type === 'requestBackground') {
                (async () => {
                    try {
                        const bgConfig = await getSetting('bgConfig');
                        if (bgConfig?.image) {
                            syncBackgroundToIframes(bgConfig.image, parseFloat(bgConfig.opacity || '0.3'));
                        }
                    } catch (err) {
                        console.error('响应背景请求失败：', err);
                    }
                })();
            }
        });

        async function applyBackground(bgImage, bgOpacity) {
            // 移除旧的动态样式
            const oldStyle = document.getElementById('dynamic-bg-style');
            if (oldStyle) oldStyle.remove();
            
            if (bgImage) {
                // 使用动态注入style标签的方式（与chat.html/setting.html一致），
                // 避免超大base64图片在CSS自定义属性中可能失效的问题
                const style = document.createElement('style');
                style.id = 'dynamic-bg-style';
                style.textContent = `
                    body::before {
                        background-image: url(${bgImage}) !important;
                        opacity: ${parseFloat(bgOpacity)} !important;
                    }
                `;
                document.head.appendChild(style);
            }
            
            // 存储逻辑改为IndexedDB，兼容旧数据迁移
            try {
                if (bgImage) {
                    await saveSetting('bgConfig', {
                        image: bgImage,
                        opacity: bgOpacity
                    });
                } else {
                    await deleteSetting('bgConfig');
                }
            } catch (err) {
                console.error('保存背景配置失败：', err);
            }
            
            // 同步背景配置到所有 iframe
            syncBackgroundToIframes(bgImage, bgOpacity);
        }

        // 向所有 iframe 发送背景配置
        function syncBackgroundToIframes(bgImage, bgOpacity) {
            const iframes = document.querySelectorAll('.content-embed');
            iframes.forEach(iframe => {
                try {
                    iframe.contentWindow.postMessage({
                        type: 'updateBackground',
                        bgImage: bgImage,
                        bgOpacity: parseFloat(bgOpacity)
                    }, '*');
                } catch (e) {
                    console.warn('无法向iframe发送背景配置', e);
                }
            });
        }

        async function applySavedBackground() {
            try {
                let bgConfig = await getSetting('bgConfig');
                
                // 旧数据自动迁移
                if (!bgConfig) {
                    const oldBg = localStorage.getItem('bgImage');
                    const oldOpacity = localStorage.getItem('bgOpacity') || '0.3';
                    if (oldBg) {
                        bgConfig = { image: oldBg, opacity: oldOpacity };
                        await saveSetting('bgConfig', bgConfig);
                        localStorage.removeItem('bgImage');
                        localStorage.removeItem('bgOpacity');
                    }
                }

                if (bgConfig?.image) {
                    applyBackground(bgConfig.image, bgConfig.opacity);
                }
            } catch (err) {
                console.error('加载背景配置失败：', err);
            }
        }
    </script>
</body>
</html>
